# Release 工作流：推 v* tag 触发桌面三平台矩阵 + Android arm64 APK，产物挂上 GitHub Release。
# 构建路线与 scripts/dist-portable.sh / dist.sh 的本机约定完全同构：
# 「raw cargo + custom-protocol」，不依赖 tauri CLI（无版本漂移、无外部下载）。
# - windows：单文件便携 exe（CRT 静态，见 .cargo/config.toml）+ tinyssh CLI exe
# - linux：dpkg-deb 手工 .deb（/usr/bin + .desktop + 图标，runner 原生工具）+ 二进制 tar.gz
# - macos（arm64/x64 双跑）：手工 .app bundle（ad-hoc 签名——arm64 拒绝执行未签名
#   二进制）+ hdiutil dmg + CLI tar.gz
# - android：aarch64 release APK，签名材料经 Secrets 注入（契约见 docs/release-android.md）
# workflow_dispatch 手动演练：只产 artifacts，不发 Release（发布只认 tag）。
# 未签名分发的用户侧提示写在 Release notes：mac 右键「打开」/ xattr，Win SmartScreen。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 不设 concurrency：同 tag 重打后新旧 run 并行跑，Release 侧靠
# create||edit + upload --clobber 收敛到最新构建；并发组反而会让新 run
# 排队卡在等不到 runner 的旧 run 后面（实测翻车）。

jobs:
  # tag 不触发 ci.yml（CI 只监听 main/PR），所以发布必须自带测试门：
  # 编译绿 ≠ 可发布，尤其 core/审批/传输这类跨 crate 改动。这里跑与
  # tier1 同构的 fmt + 单元测试 + 前端构建；完整 UI specs 仍由 PR 档覆盖。
  verify:
    name: verify · fmt + unit tests + ui build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cargo fmt --all --check
      - run: cargo test --workspace --exclude tinyssh-app --lib --bins -- --test-threads=1
        timeout-minutes: 40
      - run: cargo test -p session-api --tests -- --test-threads=1
      - run: cargo test -p session-api --features ts --test wire_codegen -- --test-threads=1
      - run: npm ci && npm run build
        working-directory: ui

  build:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "windows · portable exe + cli", os: windows-latest, id: windows }
          - { label: "linux · deb + tar.gz", os: ubuntu-24.04, id: linux }
          # mac 单跑双架构：arm64 原生 + x86_64 交叉编译（macOS 原生支持）。
          # 曾用 macos-13 独立跑 Intel——共享池紧俏排队 75min+ 不出队，弃。
          # v0.11.1：macos-14 退役（brownout 窗口直接拒出队：annotation
          # 「configuration 'macos-14-arm64-us-default' is not supported」）→ 升 macos-15。
          - { label: "macos · app + dmg（arm64 + x64）", os: macos-15, id: macos }
    defaults:
      run:
        shell: bash
    # updater 轮：签名三件套经 secrets 注入（未配置 = 空串 = 本次发布无自动更新
    # 清单，构建照常绿）。TAURI_UPDATER_PUBKEY 经 build.rs 编译进全平台产物：
    # macOS 插件通道与 Windows 便携自替换通道运行期都用它验签。
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webkit2gtk 依赖（tauri v2 = 4.1）
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            pkg-config file
      - name: 版本号（tag 优先，回退 Cargo.toml）
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
      # 前端先于 cargo：tauri 编期内嵌 ../ui/dist（build.rs 校验），缺了直接编译失败
      - name: 前端构建
        run: npm ci && npm run build
        working-directory: ui
      - name: Release 构建（tinyssh-app 便携 + tinyssh CLI）
        run: |
          set -o pipefail
          cargo build --release -p tinyssh-app -p tinyssh-cli \
            --features tinyssh-app/custom-protocol 2>&1 | tee build.log
      - name: 交叉编译 x86_64（mac 单跑双架构）
        if: startsWith(matrix.id, 'macos')
        run: |
          set -o pipefail
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p tinyssh-app -p tinyssh-cli \
            --features tinyssh-app/custom-protocol 2>&1 | tee build-x64.log
      - name: 失败转储（error 行优先，注解匿名可读）
        if: failure()
        run: |
          [ -f build.log ] || [ -f build-x64.log ] || exit 0
          { grep -n -B2 -A8 '^error' build.log build-x64.log || true; } > err.txt
          [ -s err.txt ] || tail -40 build.log > err.txt
          split -l 4 err.txt chunk_ || true
          n=0
          for c in chunk_*; do
            [ $n -ge 10 ] && break
            msg=$(cat "$c" | tr '\n' ' ' | cut -c1-240)
            echo "::error::REL $msg"
            n=$((n+1))
          done

      - name: 打包（windows · 便携 exe + CLI exe）
        if: matrix.id == 'windows'
        run: |
          mkdir -p dist
          cp target/release/tinyssh-app.exe "dist/TinySSH_${VER}_windows_x64_portable.exe"
          cp target/release/tinyssh.exe "dist/tinyssh-cli_${VER}_windows_x64.exe"

      # Windows 是主平台：mac 早有启动冒烟，Windows 一直没有。历史上有过
      # “编译绿、产物启动即崩”（v0.10.1/0.10.2），静态哨兵抓不到运行期 panic。
      - name: 启动冒烟（windows · 便携 exe 真启动）
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "TinySSH_${env:VER}_windows_x64_portable.exe" |
            Select-Object -First 1
          if (-not $exe) { Write-Host "::error::找不到便携 exe"; exit 1 }
          $db = Join-Path $env:RUNNER_TEMP "tinyssh-smoke.db"
          $out = Join-Path $env:RUNNER_TEMP "tinyssh-smoke.out.log"
          $err = Join-Path $env:RUNNER_TEMP "tinyssh-smoke.err.log"
          Remove-Item $db,$out,$err -ErrorAction SilentlyContinue
          $env:TINYSSH_DB = $db
          $env:TINYSSH_MASTER_KEY = ("ab" * 32)
          $p = Start-Process -FilePath $exe.FullName -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          $logText = ""
          foreach ($f in @($out, $err)) {
            if (Test-Path $f) { $logText += (Get-Content $f -Raw) + "`n" }
          }
          if (-not $alive) {
            Write-Host "::error::Windows 启动冒烟失败：进程提前退出（应存活 ≥15s）"
            Write-Host $logText
            exit 1
          }
          if ($logText -match "panicked") {
            Write-Host "::error::Windows 启动冒烟失败：日志出现 panic"
            Write-Host $logText
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          if (-not (Test-Path $db)) {
            Write-Host "::error::Windows 启动冒烟失败：未创建 smoke.db（未走到 vault 打开）"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Windows 启动冒烟 PASS（15s 存活，vault 已打开）"

      - name: 打包（linux · deb + tar.gz）
        if: matrix.id == 'linux'
        run: |
          mkdir -p dist
          debroot="$(mktemp -d)"
          mkdir -p "$debroot/DEBIAN" "$debroot/usr/bin" \
            "$debroot/usr/share/applications" \
            "$debroot/usr/share/icons/hicolor/512x512/apps"
          install -m 755 target/release/tinyssh-app "$debroot/usr/bin/tinyssh-app"
          cat > "$debroot/DEBIAN/control" <<EOF
          Package: tinyssh
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: TinySSH contributors <https://github.com/chenpu17/TinySSH>
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Description: TinySSH - human-AI collaborative terminal
           SSH + local shell + embedded TinyAgent, behind approvals / audit /
           control hand-off. Desktop app (Tauri/WebKitGTK).
          EOF
          cat > "$debroot/usr/share/applications/tinyssh.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=TinySSH
          Exec=/usr/bin/tinyssh-app
          Icon=tinyssh
          Categories=Network;
          EOF
          cp src-tauri/icons/icon.png "$debroot/usr/share/icons/hicolor/512x512/apps/tinyssh.png"
          dpkg-deb --build --root-owner-group "$debroot" "dist/TinySSH_${VER}_linux_amd64.deb"
          tgz="$(mktemp -d)"
          cp target/release/tinyssh-app "$tgz/tinyssh-app"
          cp target/release/tinyssh "$tgz/tinyssh"
          tar -czf "dist/TinySSH_${VER}_linux_amd64.tar.gz" -C "$tgz" tinyssh-app tinyssh

      - name: 打包（macos · 双架构 .app + dmg）
        if: startsWith(matrix.id, 'macos')
        run: |
          set -euo pipefail
          # 打包失败时把具体命令与 stderr 以 ::error:: 注解公开（匿名可读）；
          # 上一轮 v0.11.5 只看到笼统的 exit code 1，无法定位 codesign/hdiutil。
          run() {
            local rc=0
            "$@" 2>>pkg.err || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::mac 打包失败：$*（rc=$rc）"
              tail -10 pkg.err | sed 's/^/::error::REL /' || true
              exit "$rc"
            fi
          }
          # codesign/hdiutil 在共享 runner 上偶发瞬时失败（钥匙串/卷挂载竞争）；
          # 重试一次，仍失败才把 stderr 注解出来。cp/mkdir 等确定性命令不重试。
          run_retry() {
            local rc=0 n=0
            until "$@" 2>>pkg.err; do
              rc=$?
              n=$((n+1))
              if [ "$n" -ge 2 ]; then
                echo "::error::mac 打包失败：$*（rc=$rc，已重试 $n 次）"
                tail -10 pkg.err | sed 's/^/::error::REL /' || true
                exit "$rc"
              fi
              sleep 2
            done
          }
          mkdir -p dist
          # Info.plist 用 echo 行拼（函数体内 heredoc 终止符必须顶格，缩进会炸）
          write_plist() {
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>CFBundleName</key><string>TinySSH</string>'
              echo '  <key>CFBundleDisplayName</key><string>TinySSH</string>'
              echo '  <key>CFBundleIdentifier</key><string>com.tinyssh.app</string>'
              echo "  <key>CFBundleVersion</key><string>${VER}</string>"
              echo "  <key>CFBundleShortVersionString</key><string>${VER}</string>"
              echo '  <key>CFBundleExecutable</key><string>TinySSH</string>'
              echo '  <key>CFBundleIconFile</key><string>TinySSH</string>'
              echo '  <key>CFBundlePackageType</key><string>APPL</string>'
              echo '  <key>LSMinimumSystemVersion</key><string>10.15</string>'
              echo '  <key>NSHighResolutionCapable</key><true/>'
              echo '</dict>'
              echo '</plist>'
            } > "$1"
          }
          # $1=架构标签 $2=二进制目录（native=target/release，交叉=target/<triple>/release）
          bundle_arch() {
            local staging="dist/staging-$1"
            local app="$staging/TinySSH.app"
            : > pkg.err
            run mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            run cp "$2/tinyssh-app" "$app/Contents/MacOS/TinySSH"
            run cp src-tauri/icons/icon.icns "$app/Contents/Resources/TinySSH.icns"
            run write_plist "$app/Contents/Info.plist"
            # ad-hoc 签名兜底：Apple Silicon 拒绝执行完全未签名的二进制；
            # Gatekeeper（下载隔离）仍需用户右键「打开」/xattr，Release notes 有说明。
            # xattr 清理：cargo 缓存/runner 偶尔给二进制带上扩展属性，codesign 会以
            # 「resource fork, Finder information, or similar detritus not allowed」
            # 失败（v0.11.5 mac 打包失败的头号嫌疑）；清理后再签。
            xattr -cr "$app" || true
            run_retry codesign --force -s - "$app"
            run_retry codesign --verify --verbose=2 "$app"
            run ditto -c -k --keepParent "$app" "dist/TinySSH_${VER}_macos_$1.app.zip"
            # updater 轮：自动更新通道用 .app.tar.gz（tauri updater 的 mac 更新格式）
            run tar -czf "dist/TinySSH_${VER}_macos_$1.app.tar.gz" -C "$staging" TinySSH.app
            run ln -s /Applications "$staging/Applications"
            run_retry hdiutil create -volname TinySSH -srcfolder "$staging" -ov -format UDZO \
              "dist/TinySSH_${VER}_macos_$1.dmg"
            rm -rf "$staging"
            local tgz
            tgz="$(mktemp -d)"
            run cp "$2/tinyssh" "$tgz/tinyssh"
            run tar -czf "dist/tinyssh-cli_${VER}_macos_$1.tar.gz" -C "$tgz" tinyssh
          }
          bundle_arch arm64 target/release
          bundle_arch x86_64 target/x86_64-apple-darwin/release

      - name: 启动冒烟（macos · 真启动探活）
        if: matrix.id == 'macos'
        run: |
          # 三路全盲补位：UI 套件 / cargo test / CI 构建都不启动产物——macOS 配置
          # 覆盖层双建 main webview（a9e4ec4）随 v0.10.0–0.10.2 三版出货无人知。
          # 解包 arm64 .app 真启动：15s 进程存活 + setup 钩子走到 + 日志无 panic。
          # TINYSSH_MASTER_KEY 环境变量绕开钥匙串（runner 上避免 ACL 交互挂起）。
          set -e
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          ditto -x -k "$GITHUB_WORKSPACE/dist/TinySSH_${VER}_macos_arm64.app.zip" .
          export TINYSSH_DB="$PWD/smoke.db"
          export TINYSSH_MASTER_KEY="$(printf 'ab%.0s' $(seq 1 32))"
          "./TinySSH.app/Contents/MacOS/TinySSH" > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 15); do
            sleep 1
            kill -0 "$pid" 2>/dev/null || break
          done
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::mac 启动冒烟失败：进程提前退出（应存活 ≥15s）"
            cat smoke.log
            exit 1
          fi
          if grep -q "panicked" smoke.log; then
            echo "::error::mac 启动冒烟失败：日志出现 panic"
            cat smoke.log
            kill "$pid"
            exit 1
          fi
          grep -q "setup: windows=" smoke.log || {
            echo "::error::mac 启动冒烟失败：未到达 setup 钩子"
            cat smoke.log
            kill "$pid"
            exit 1
          }
          kill "$pid"
          echo "mac 启动冒烟 PASS（15s 存活，setup 正常，无 panic）"

      - name: 自动更新签名与清单片段（Windows 便携；未配 secrets 时如实跳过）
        if: matrix.id == 'windows'
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY —— 本次发布无自动更新清单"
            exit 0
          fi
          npm i -g @tauri-apps/cli@2
          set -e
          f="dist/TinySSH_${VER}_windows_x64_portable.exe"
          tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$f"
          # 清单片段：本机产物条目（windows-x86_64），由 release 作业合并成
          # latest.json。signature = .sig 文件原文（tauri signer 产出的 .sig
          # 本身就是 minisign 文本的单行 base64，插件与应用内验签都直接消费）。
          # 全程保持 set -e：片段写盘与 JSON 自检失败即本步骤失败，不留坏清单。
          sig=$(cat "$f.sig")
          printf '{"windows-x86_64": { "signature": "%s", "url": "https://github.com/%s/releases/download/%s/%s" }}' \
            "$sig" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$(basename "$f")" \
            > dist/updater-frag-windows.json
          node -e "JSON.parse(require('fs').readFileSync('dist/updater-frag-windows.json','utf8')); console.log('windows 清单片段合法')"

      - name: 自动更新签名与清单片段（macOS；未配 secrets 时如实跳过）
        if: matrix.id == 'macos'
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY —— 本次发布无自动更新清单（应用内不出现「自动更新」入口）"
            exit 0
          fi
          npm i -g @tauri-apps/cli@2
          set -e
          for f in dist/TinySSH_${VER}_macos_*.app.tar.gz; do
            tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$f"
          done
          # 清单片段：本机产物条目（darwin-aarch64 / darwin-x86_64），由 release
          # 作业合并成 latest.json。signature = .sig 文件原文（单行 base64，见
          # windows 同名步骤注释）。全程 set -e（循环里用 if 而非 && 短路，
          # 免得首元素时 [ ] 假值被 -e 误杀）。
          {
            printf '{'
            first=1
            for pair in "darwin-aarch64:TinySSH_${VER}_macos_arm64.app.tar.gz" \
                        "darwin-x86_64:TinySSH_${VER}_macos_x86_64.app.tar.gz"; do
              plat="${pair%%:*}"; file="${pair#*:}"
              sig=$(cat "dist/${file}.sig")
              if [ "$first" -eq 0 ]; then printf ','; fi
              printf '"%s": { "signature": "%s", "url": "https://github.com/%s/releases/download/%s/%s" }' \
                "$plat" "$sig" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$file"
              first=0
            done
            printf '}'
          } > dist/updater-frag-darwin.json
          node -e "JSON.parse(require('fs').readFileSync('dist/updater-frag-darwin.json','utf8')); console.log('darwin 清单片段合法')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  # Android release APK：与 ci.yml 的 android 档同构（JDK17 / aarch64 / SDK+NDK /
  # cargo-tauri 缓存 / 16 KB 门），额外做版本号、签名与 applicationId 断言。
  # tag 发布时产物进同一个 Release；workflow_dispatch 只演练构建（release 作业因
  # 非 tag 跳过）。签名材料只经 Secrets 注入，步骤结束 always() 清理。
  #
  # 签名 Secrets 未配置时整档跳过（secrets_probe 先探，见下）：PC 发布是主链路，
  # 不能被可选的 Android 签名卡死——否则一个没配 keystore 的仓库连打 tag 都发不出
  # 桌面产物（此前 release.needs 硬绑定 android，android 失败即整条发布被跳过）。
  secrets_probe:
    name: probe · Android 签名 Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.chk.outputs.ok }}
    steps:
      - id: chk
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Android 签名 Secrets 已配置，构建 release APK"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "未配置 ANDROID_KEYSTORE_BASE64 —— 跳过 Android APK，仅发布桌面三平台"
          fi

  android:
    name: android · aarch64 APK（release 签名）
    needs: [verify, secrets_probe]
    if: needs.secrets_probe.outputs.android == 'true'
    runs-on: ubuntu-24.04
    # release 冷编（opt-level 3 + R8）比 debug 慢；首跑按 60-90min 估，留足余量。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      # 只编 arm64：真机全是 arm64；x86_64 只用于本地模拟器，不进 GitHub Release。
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }

      # release 产物大（debug 单 ABI .so 已 96MB），tag 发布不频繁：
      # 只缓存 registry，不缓存 target，避免和 ci.yml 的 android 缓存一起挤爆 10GB 上限。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-targets: false
          key: android-release

      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      # 与 ci.yml 的 android 作业同构；NDK 取 ndk/ 下最高版本（cargo-mobile2 的
      # ensure_ndk 无视 NDK_HOME，16 KB 门才是唯一判据）。
      - name: Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-36" "build-tools;36.1.0" > /dev/null
          if [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
            "$SM" --install "ndk;27.0.12077973" > /dev/null
          fi
          NDK=$(ls -d "$SDK"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDKs:"; ls "$SDK/ndk"

      - uses: gradle/actions/setup-gradle@v4

      # 仓库里的 wrapper 指向腾讯镜像（本机友好，GitHub runner 未实证）。
      # CI 单次改成官方分发；本机文件不动。
      - name: Gradle 分发源改用官方（仅 CI）
        run: |
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#' \
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      # Gradle 的 rust 回调调用的是 `cargo tauri android android-studio-script`，
      # 必须有 cargo-tauri 可执行文件（npm 的 @tauri-apps/cli 只有 tauri）。
      - uses: actions/cache@v4
        id: cargo-tauri
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-2.10.1-${{ runner.os }}
      - if: steps.cargo-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.10.1 --locked

      - run: npm ci
        working-directory: ui

      # APK 的 versionName/versionCode 来自 tauri CLI 依据 tauri.conf.json 生成的
      # tauri.properties，不是 tag。tag 与 conf 不一致必须在这里挡下。
      - name: 版本号（tag 必须与 tauri.conf 一致）
        run: |
          CONF_VER=$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            if [ "$VER" != "$CONF_VER" ]; then
              echo "::error::tag v$VER 与 tauri.conf 版本 $CONF_VER 不一致（三源同升后再打 tag）"
              exit 1
            fi
          else
            VER="$CONF_VER"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "构建版本：$VER"

      # 证书只落 $RUNNER_TEMP 与 gitignored 的 key.properties；always() 步骤删除。
      # 不 echo 任何 secret；不要开 set -x。构建前先用 keytool 校验口令/别名，
      # 避免坏 Secrets 在 60-90min 的冷编之后才暴露。
      - name: 准备签名（Secrets → keystore + key.properties）
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for pair in "ANDROID_KEYSTORE_BASE64:KS_B64" \
                      "ANDROID_KEYSTORE_PASSWORD:KS_PASS" \
                      "ANDROID_KEY_ALIAS:KS_ALIAS" \
                      "ANDROID_KEY_PASSWORD:KEY_PASS"; do
            name="${pair%%:*}"; var="${pair#*:}"
            if [ -z "${!var:-}" ]; then
              echo "::error::未配置 Secrets.$name；release APK 必须签名（unsigned 装不上）"
              exit 1
            fi
          done
          KS="$RUNNER_TEMP/tinyssh-release.jks"
          printf '%s' "$KS_B64" | tr -d '\r\n' | base64 -d > "$KS"
          chmod 600 "$KS"
          [ -s "$KS" ] || { echo "::error::keystore 解码为空"; exit 1; }
          # 提前校验：store 口令 / 别名 / key 口令错误都在这里失败，不烧完整构建时间。
          keytool -list -keystore "$KS" -storepass:env KS_PASS -alias "$KS_ALIAS" > /dev/null \
            || { echo "::error::keystore 口令或别名错误（检查 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS）"; exit 1; }
          keytool -certreq -alias "$KS_ALIAS" -keystore "$KS" \
              -storepass:env KS_PASS -keypass:env KEY_PASS > /dev/null \
            || { echo "::error::密钥口令错误（检查 ANDROID_KEY_PASSWORD）"; exit 1; }
          # 注意：Properties 里反斜杠是转义符；Linux runner 路径无此问题，
          # 本机 Windows 写 key.properties 时用正斜杠或双反斜杠。
          # 用 printf 而非缩进 heredoc：避免行首空格进入 properties。
          {
            printf 'storeFile=%s\n' "$KS"
            printf 'storePassword=%s\n' "$KS_PASS"
            printf 'keyAlias=%s\n' "$KS_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASS"
          } > src-tauri/gen/android/key.properties
          chmod 600 src-tauri/gen/android/key.properties

      # release 是默认构建类型；CLI 没有 --release 参数，`--debug` 才是 debug。
      # -f mobile 必须显式（tauri.android.conf.json 的 build.features 不被采纳）。
      # 签名材料同时以环境变量注入（Gradle 侧优先于 key.properties）：口令含反斜杠 /
      # 非 ASCII 字符时不会被 .properties 的转义与 ISO-8859-1 解码改写。
      - name: 构建 release APK（aarch64）
        env:
          TINYSSH_ANDROID_KEYSTORE: ${{ runner.temp }}/tinyssh-release.jks
          TINYSSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TINYSSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TINYSSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo tauri android build --target aarch64 --apk --ci -f mobile

      - name: 定位 APK + 签名/版本断言
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          OUT=src-tauri/gen/android/app/build/outputs/apk
          # 用 -print -quit 而非 `| head -1`：pipefail 下 find/sed 被 head 提前关管道
          # 会拿到 SIGPIPE（141）而整步失败。
          APK=$(find "$OUT" -path '*release*' -name 'app-universal-release.apk' -print -quit)
          if [ -z "$APK" ]; then
            APK=$(find "$OUT" -path '*release*' -name '*.apk' -print -quit)
          fi
          [ -n "$APK" ] || { echo "::error::未找到 release APK"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

          BT=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -1)
          # 未签名 / 坏签名直接失败（unsigned APK 无法安装，绝不能进 Release）
          if ! "$BT/apksigner" verify --print-certs "$APK" 2>&1 | tee "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK 未签名或签名无效（本地无 key.properties 时 Gradle 产 unsigned 包）"
            exit 1
          fi
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK 由 Android Debug 证书签名，禁止发布"
            exit 1
          fi
          CERT_SHA=$(sed -n 's/.*SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | sed -n '1p')
          [ -n "$CERT_SHA" ] || { echo "::error::未从 apksigner 输出解析到证书 SHA-256"; exit 1; }
          {
            echo "### Android APK"
            echo "- 证书 SHA-256: \`$CERT_SHA\`"
            echo "- 文件: \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"
          # 指纹比较容忍大小写与冒号分隔（apksigner 输出无冒号，用户可能贴带冒号的）。
          CERT_NORM=$(echo "$CERT_SHA" | tr -d ':' | tr 'A-F' 'a-f')
          PIN_NORM=$(echo "${ANDROID_CERT_SHA256:-}" | tr -d ':' | tr 'A-F' 'a-f')
          if [ -n "$PIN_NORM" ] && [ "$CERT_NORM" != "$PIN_NORM" ]; then
            echo "::error::证书指纹与仓库变量 ANDROID_CERT_SHA256 不一致（换过签名密钥？）"
            exit 1
          fi

          BADGING=$("$BT/aapt2" dump badging "$APK")
          FIRST=$(printf '%s\n' "$BADGING" | sed -n '1p')
          echo "$FIRST"
          # here-string 而非管道：grep -q 命中即退出，pipefail 下会把上游打成 SIGPIPE。
          grep -q "package: name='com.tinyssh.app'" <<<"$BADGING" \
            || { echo "::error::applicationId 不是 com.tinyssh.app"; exit 1; }
          grep -q "versionName='${VER}'" <<<"$BADGING" \
            || { echo "::error::APK versionName != ${VER}"; exit 1; }
          VC=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$FIRST")
          echo "versionCode=$VC（升级判定用它；必须严格大于上一版）"
          if [[ "$VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            EXPECTED=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
            [ "$VC" = "$EXPECTED" ] || echo "::warning::versionCode=$VC，按 semver 推算为 $EXPECTED（若 tauri 规则变了需复核单调性）"
          fi

      - name: 16 KB 页对齐门（release ELF + APK）
        run: |
          bash scripts/ci/check-android-16kb.sh \
            target/aarch64-linux-android/release/libtinyssh_app_lib.so \
            "$APK"

      - name: 产物命名（随 dist-* 进同一个 Release）
        run: |
          mkdir -p dist
          cp "$APK" "dist/TinySSH_${VER}_android_arm64.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

      - name: 清理签名材料
        if: always()
        run: |
          rm -f src-tauri/gen/android/key.properties \
                "$RUNNER_TEMP/tinyssh-release.jks" "$RUNNER_TEMP/certs.txt"

  release:
    name: GitHub Release
    needs: [build, android]
    # always()：android 被 secrets_probe 跳过（或失败）时也不得吞掉桌面发布——
    # PC 是主链路。真正的底线是 build 三平台成功（失败则不发 Release）。
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: "dist-*", merge-multiple: true, path: rel }
      - name: 合并更新清单（updater-frag-* → latest.json；无片段如实跳过）
        run: |
          cd rel
          VER="${GITHUB_REF_NAME#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export VER PUB_DATE
          frags=$(ls updater-frag-*.json 2>/dev/null || true)
          if [ -z "$frags" ]; then
            echo "无 updater 清单片段（未配签名 secrets）——本次发布无 latest.json"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const platforms = {};
            for (const f of process.argv.slice(1)) {
              Object.assign(platforms, JSON.parse(fs.readFileSync(f, "utf8")));
            }
            fs.writeFileSync("latest.json", JSON.stringify(
              { version: process.env.VER, pub_date: process.env.PUB_DATE, platforms }, null, 2));
          ' $frags
          node -e "const m=JSON.parse(require('fs').readFileSync('latest.json','utf8')); if(!m.version||!Object.keys(m.platforms).length){process.exit(1)}; console.log('latest.json 合法（'+Object.keys(m.platforms).length+' 平台）')"
          # 片段只服务合并，不进 Release 也不进 SHA256SUMS（sha256sum * 会收
          # 目录内一切文件，残留在场会让用户 sha256sum -c 报孤儿条目）。
          rm -f updater-frag-*.json
      - name: 校验和与发布说明
        run: |
          cd rel
          # VER 补齐（曾随 v0.10.6 发出空 VER 的下载表——VER 原先只在 build 作业生效）
          VER="${GITHUB_REF_NAME#v}"
          export VER
          ls -l
          sha256sum * > SHA256SUMS.txt
          # Android 行随 APK 实际在场：未配签名 Secrets 时 android 档整体跳过，
          # 下载表不能凭空列一个不存在的包（别让用户对着 404 找 APK）。
          ANDROID_ROW=""
          ANDROID_NOTE=""
          if [ -f "TinySSH_${VER}_android_arm64.apk" ]; then
            ANDROID_ROW="| Android 7.0+ (arm64) | \`TinySSH_${VER}_android_arm64.apk\`（侧载安装，见下方 Android 提示） |"
            ANDROID_NOTE="- Android（仅 arm64，未上架 Play）：从浏览器下载后，首次需在「设置 → 应用 → 特殊权限 → 安装未知应用」允许所用浏览器/文件管理器；Play Protect 提示「未知开发者」时选「仍要安装」。无自动更新，升级 = 下载新 APK 覆盖安装（签名必须一致，\`versionCode\` 递增）。若装过旧 debug 签名包，必须先卸载——卸载会清掉应用内数据（主机/凭据），请自行评估后再装。"
          fi
          cat > notes.md <<EOF
          ## 下载 / Downloads

          | 平台 | 产物 |
          |---|---|
          | Windows 10/11 x64 | \`TinySSH_${VER}_windows_x64_portable.exe\`（单文件便携版）+ \`tinyssh-cli_*.exe\` |
          | macOS 11+ (Apple Silicon) | \`TinySSH_${VER}_macos_arm64.app.zip\` / \`.dmg\` |
          | macOS 10.15+ (Intel) | \`TinySSH_${VER}_macos_x86_64.app.zip\` / \`.dmg\` |
          | Linux amd64 | \`TinySSH_${VER}_linux_amd64.deb\`（推荐，自动拉依赖）或 \`.tar.gz\`（需自备 libwebkit2gtk-4.1-0） |
          ${ANDROID_ROW}

          ## 安装提示 / Install notes

          - Windows：SmartScreen 提示时点「更多信息 → 仍要运行」（未签名分发）。
          - macOS：未签名/未公证。下载后先用 Finder 把 App 拖入「应用程序」（避免系统隔离转存导致钥匙串反复弹窗），首开右键 →「打开」；仍被拦则终端执行 \`xattr -cr /Applications/TinySSH.app\`。系统弹出钥匙串访问时点「允许」（凭据加密主密钥存于钥匙串）。
          - Linux：deb 自动拉取 WebKitGTK 依赖；tar.gz 路线先 \`sudo apt install libwebkit2gtk-4.1-0 libgtk-3-0\`。
          ${ANDROID_NOTE}
          - \`tinyssh\` CLI：随附的命令行伴侣（主机 / Agent Token / 审批 / 接管 / 简报 / 审计），与人机协同主程序同走一套核心。

          构建于 commit ${GITHUB_SHA}。运行期依赖：Windows 自带 WebView2；Linux WebKitGTK 4.1；macOS 系统 WKWebView。
          EOF
          # updater 轮：latest.json 在场（配了签名 secrets）→ 自动更新说明；否则如实说明
          if [ -f latest.json ]; then
            echo "- 自动更新：macOS（.app/.dmg 安装形态）与 Windows 便携版在应用内 设置 → 关于 →「自动更新（下载并重启）」一键升级；Linux 请从本页下载新产物替换。" >> notes.md
          else
            echo "- 自动更新：本次发布未配置更新签名（TAURI_SIGNING_* / TAURI_UPDATER_PUBKEY secrets 未设置），应用内不出现「自动更新」入口——请从本页手动下载更新。" >> notes.md
          fi
      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # 本作业不 checkout，rel/ 下没有 .git：gh 无法自行推断仓库。
          # 此前靠 curl 兜底「碰巧」成功（v0.12.6），一旦 Release 已存在，
          # 兜底 POST 422 就整步失败（v0.12.7 源码包之外无产物）。
          GH_REPO: ${{ github.repository }}
        run: |
          cd rel
          ls -l
          set -o pipefail
          # create 容错（tag 重打后旧 run 可能已建同 tag release）：已存在则 edit，
          # 产物一律 --clobber 上传，收敛到最新一次构建。gh 失败再走 curl 直连
          # REST 兜底（node 造 JSON 保证 notes 转义正确）。同 tag Release 已存在时
          # GitHub 返回 422：视为「已创建」，继续走上传收敛；其余状态码（401/403/5xx
          # 等）仍失败——鉴权/参数错误不得吞成成功。注释不能插在续行 && 之前：
          # bash 会把注释行当逻辑行结束，下一行以 && 开头直接语法错误（v0.12.8 实测）。
          { gh release create "$GITHUB_REF_NAME" \
              --title "TinySSH ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md \
              --latest \
              TinySSH_* tinyssh-cli_* SHA256SUMS.txt $( [ -f latest.json ] && echo latest.json ) \
            || gh release edit "$GITHUB_REF_NAME" \
              --title "TinySSH ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md --latest \
            || { node -e "
                  const fs=require('fs');
                  fs.writeFileSync('body.json', JSON.stringify({
                    tag_name: process.env.GITHUB_REF_NAME,
                    name: 'TinySSH ' + process.env.GITHUB_REF_NAME.slice(1),
                    body: fs.readFileSync('notes.md','utf8'),
                    make_latest: 'true',
                  }));
                " \
              && code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
                --data-binary @body.json) \
              && { [ "$code" = "201" ] || [ "$code" = "422" ]; }; } \
          } 2>&1 | tee rel.log
          gh release upload "$GITHUB_REF_NAME" --clobber \
            TinySSH_* tinyssh-cli_* SHA256SUMS.txt $( [ -f latest.json ] && echo latest.json ) 2>&1 | tee -a rel.log \
          || { # curl 兜底上传：取 release id，逐个 POST 到 uploads.github.com
            rid=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$GITHUB_REF_NAME" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).id)})")
            for f in TinySSH_* tinyssh-cli_* SHA256SUMS.txt $( [ -f latest.json ] && echo latest.json ); do
              curl -sf -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$rid/assets?name=$f"
            done
          }
      - name: Release 失败转储（注解匿名可读）
        if: failure()
        run: |
          [ -f rel/rel.log ] || exit 0
          tail -24 rel/rel.log > err.txt
          split -l 4 err.txt chunk_ || true
          for c in chunk_*; do
            msg=$(cat "$c" | tr '\n' ' ' | cut -c1-240)
            echo "::error::GH-REL $msg"
          done
