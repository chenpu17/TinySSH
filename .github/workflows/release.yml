# Release 工作流：推 v* tag 触发四平台矩阵构建，产物挂上 GitHub Release。
# 构建路线与 scripts/dist-portable.sh / dist.sh 的本机约定完全同构：
# 「raw cargo + custom-protocol」，不依赖 tauri CLI（无版本漂移、无外部下载）。
# - windows：单文件便携 exe（CRT 静态，见 .cargo/config.toml）+ tinyssh CLI exe
# - linux：dpkg-deb 手工 .deb（/usr/bin + .desktop + 图标，runner 原生工具）+ 二进制 tar.gz
# - macos（arm64/x64 双跑）：手工 .app bundle（ad-hoc 签名——arm64 拒绝执行未签名
#   二进制）+ hdiutil dmg + CLI tar.gz
# workflow_dispatch 手动演练：只产 artifacts，不发 Release（发布只认 tag）。
# 未签名分发的用户侧提示写在 Release notes：mac 右键「打开」/ xattr，Win SmartScreen。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 不设 concurrency：同 tag 重打后新旧 run 并行跑，Release 侧靠
# create||edit + upload --clobber 收敛到最新构建；并发组反而会让新 run
# 排队卡在等不到 runner 的旧 run 后面（实测翻车）。

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "windows · portable exe + cli", os: windows-latest, id: windows }
          - { label: "linux · deb + tar.gz", os: ubuntu-24.04, id: linux }
          # mac 单跑双架构：arm64 原生 + x86_64 交叉编译（macOS 原生支持）。
          # 曾用 macos-13 独立跑 Intel——共享池紧俏排队 75min+ 不出队，弃。
          - { label: "macos · app + dmg（arm64 + x64）", os: macos-14, id: macos }
    defaults:
      run:
        shell: bash
    # updater 轮：签名三件套经 secrets 注入（未配置 = 空串 = 本次发布无自动更新
    # 清单，构建照常绿）。TAURI_UPDATER_PUBKEY 经 build.rs 编译进全平台产物：
    # macOS 插件通道与 Windows 便携自替换通道运行期都用它验签。
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webkit2gtk 依赖（tauri v2 = 4.1）
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            pkg-config file
      - name: 版本号（tag 优先，回退 Cargo.toml）
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
      # 前端先于 cargo：tauri 编期内嵌 ../ui/dist（build.rs 校验），缺了直接编译失败
      - name: 前端构建
        run: npm ci && npm run build
        working-directory: ui
      - name: Release 构建（tinyssh-app 便携 + tinyssh CLI）
        run: |
          set -o pipefail
          cargo build --release -p tinyssh-app -p tinyssh-cli \
            --features tinyssh-app/custom-protocol 2>&1 | tee build.log
      - name: 交叉编译 x86_64（mac 单跑双架构）
        if: startsWith(matrix.id, 'macos')
        run: |
          set -o pipefail
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p tinyssh-app -p tinyssh-cli \
            --features tinyssh-app/custom-protocol 2>&1 | tee build-x64.log
      - name: 失败转储（error 行优先，注解匿名可读）
        if: failure()
        run: |
          [ -f build.log ] || [ -f build-x64.log ] || exit 0
          { grep -n -B2 -A8 '^error' build.log build-x64.log || true; } > err.txt
          [ -s err.txt ] || tail -40 build.log > err.txt
          split -l 4 err.txt chunk_ || true
          n=0
          for c in chunk_*; do
            [ $n -ge 10 ] && break
            msg=$(cat "$c" | tr '\n' ' ' | cut -c1-240)
            echo "::error::REL $msg"
            n=$((n+1))
          done

      - name: 打包（windows · 便携 exe + CLI exe）
        if: matrix.id == 'windows'
        run: |
          mkdir -p dist
          cp target/release/tinyssh-app.exe "dist/TinySSH_${VER}_windows_x64_portable.exe"
          cp target/release/tinyssh.exe "dist/tinyssh-cli_${VER}_windows_x64.exe"

      - name: 打包（linux · deb + tar.gz）
        if: matrix.id == 'linux'
        run: |
          mkdir -p dist
          debroot="$(mktemp -d)"
          mkdir -p "$debroot/DEBIAN" "$debroot/usr/bin" \
            "$debroot/usr/share/applications" \
            "$debroot/usr/share/icons/hicolor/512x512/apps"
          install -m 755 target/release/tinyssh-app "$debroot/usr/bin/tinyssh-app"
          cat > "$debroot/DEBIAN/control" <<EOF
          Package: tinyssh
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: TinySSH contributors <https://github.com/chenpu17/TinySSH>
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0
          Description: TinySSH - human-AI collaborative terminal
           SSH + local shell + embedded TinyAgent, behind approvals / audit /
           control hand-off. Desktop app (Tauri/WebKitGTK).
          EOF
          cat > "$debroot/usr/share/applications/tinyssh.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=TinySSH
          Exec=/usr/bin/tinyssh-app
          Icon=tinyssh
          Categories=Network;
          EOF
          cp src-tauri/icons/icon.png "$debroot/usr/share/icons/hicolor/512x512/apps/tinyssh.png"
          dpkg-deb --build --root-owner-group "$debroot" "dist/TinySSH_${VER}_linux_amd64.deb"
          tgz="$(mktemp -d)"
          cp target/release/tinyssh-app "$tgz/tinyssh-app"
          cp target/release/tinyssh "$tgz/tinyssh"
          tar -czf "dist/TinySSH_${VER}_linux_amd64.tar.gz" -C "$tgz" tinyssh-app tinyssh

      - name: 打包（macos · 双架构 .app + dmg）
        if: startsWith(matrix.id, 'macos')
        run: |
          mkdir -p dist
          # Info.plist 用 echo 行拼（函数体内 heredoc 终止符必须顶格，缩进会炸）
          write_plist() {
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>CFBundleName</key><string>TinySSH</string>'
              echo '  <key>CFBundleDisplayName</key><string>TinySSH</string>'
              echo '  <key>CFBundleIdentifier</key><string>com.tinyssh.app</string>'
              echo "  <key>CFBundleVersion</key><string>${VER}</string>"
              echo "  <key>CFBundleShortVersionString</key><string>${VER}</string>"
              echo '  <key>CFBundleExecutable</key><string>TinySSH</string>'
              echo '  <key>CFBundleIconFile</key><string>TinySSH</string>'
              echo '  <key>CFBundlePackageType</key><string>APPL</string>'
              echo '  <key>LSMinimumSystemVersion</key><string>10.15</string>'
              echo '  <key>NSHighResolutionCapable</key><true/>'
              echo '</dict>'
              echo '</plist>'
            } > "$1"
          }
          # $1=架构标签 $2=二进制目录（native=target/release，交叉=target/<triple>/release）
          bundle_arch() {
            local staging="dist/staging-$1"
            local app="$staging/TinySSH.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "$2/tinyssh-app" "$app/Contents/MacOS/TinySSH"
            cp src-tauri/icons/icon.icns "$app/Contents/Resources/TinySSH.icns"
            write_plist "$app/Contents/Info.plist"
            # ad-hoc 签名兜底：Apple Silicon 拒绝执行完全未签名的二进制；
            # Gatekeeper（下载隔离）仍需用户右键「打开」/xattr，Release notes 有说明
            codesign --force -s - "$app"
            ditto -c -k --keepParent "$app" "dist/TinySSH_${VER}_macos_$1.app.zip"
            # updater 轮：自动更新通道用 .app.tar.gz（tauri updater 的 mac 更新格式）
            tar -czf "dist/TinySSH_${VER}_macos_$1.app.tar.gz" -C "$staging" TinySSH.app
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname TinySSH -srcfolder "$staging" -ov -format UDZO \
              "dist/TinySSH_${VER}_macos_$1.dmg"
            rm -rf "$staging"
            local tgz
            tgz="$(mktemp -d)"
            cp "$2/tinyssh" "$tgz/tinyssh"
            tar -czf "dist/tinyssh-cli_${VER}_macos_$1.tar.gz" -C "$tgz" tinyssh
          }
          bundle_arch arm64 target/release
          bundle_arch x86_64 target/x86_64-apple-darwin/release

      - name: 启动冒烟（macos · 真启动探活）
        if: matrix.id == 'macos'
        run: |
          # 三路全盲补位：UI 套件 / cargo test / CI 构建都不启动产物——macOS 配置
          # 覆盖层双建 main webview（a9e4ec4）随 v0.10.0–0.10.2 三版出货无人知。
          # 解包 arm64 .app 真启动：15s 进程存活 + setup 钩子走到 + 日志无 panic。
          # TINYSSH_MASTER_KEY 环境变量绕开钥匙串（runner 上避免 ACL 交互挂起）。
          set -e
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          ditto -x -k "$GITHUB_WORKSPACE/dist/TinySSH_${VER}_macos_arm64.app.zip" .
          export TINYSSH_DB="$PWD/smoke.db"
          export TINYSSH_MASTER_KEY="$(printf 'ab%.0s' $(seq 1 32))"
          "./TinySSH.app/Contents/MacOS/TinySSH" > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 15); do
            sleep 1
            kill -0 "$pid" 2>/dev/null || break
          done
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::mac 启动冒烟失败：进程提前退出（应存活 ≥15s）"
            cat smoke.log
            exit 1
          fi
          if grep -q "panicked" smoke.log; then
            echo "::error::mac 启动冒烟失败：日志出现 panic"
            cat smoke.log
            kill "$pid"
            exit 1
          fi
          grep -q "setup: windows=" smoke.log || {
            echo "::error::mac 启动冒烟失败：未到达 setup 钩子"
            cat smoke.log
            kill "$pid"
            exit 1
          }
          kill "$pid"
          echo "mac 启动冒烟 PASS（15s 存活，setup 正常，无 panic）"

      - name: 自动更新签名与清单片段（Windows 便携；未配 secrets 时如实跳过）
        if: matrix.id == 'windows'
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY —— 本次发布无自动更新清单"
            exit 0
          fi
          npm i -g @tauri-apps/cli@2
          set -e
          f="dist/TinySSH_${VER}_windows_x64_portable.exe"
          tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$f"
          # 清单片段：本机产物条目（windows-x86_64），由 release 作业合并成
          # latest.json。signature = .sig 文件原文（tauri signer 产出的 .sig
          # 本身就是 minisign 文本的单行 base64，插件与应用内验签都直接消费）。
          # 全程保持 set -e：片段写盘与 JSON 自检失败即本步骤失败，不留坏清单。
          sig=$(cat "$f.sig")
          printf '{"windows-x86_64": { "signature": "%s", "url": "https://github.com/%s/releases/download/%s/%s" }}' \
            "$sig" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$(basename "$f")" \
            > dist/updater-frag-windows.json
          node -e "JSON.parse(require('fs').readFileSync('dist/updater-frag-windows.json','utf8')); console.log('windows 清单片段合法')"

      - name: 自动更新签名与清单片段（macOS；未配 secrets 时如实跳过）
        if: matrix.id == 'macos'
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY —— 本次发布无自动更新清单（应用内不出现「自动更新」入口）"
            exit 0
          fi
          npm i -g @tauri-apps/cli@2
          set -e
          for f in dist/TinySSH_${VER}_macos_*.app.tar.gz; do
            tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$f"
          done
          # 清单片段：本机产物条目（darwin-aarch64 / darwin-x86_64），由 release
          # 作业合并成 latest.json。signature = .sig 文件原文（单行 base64，见
          # windows 同名步骤注释）。全程 set -e（循环里用 if 而非 && 短路，
          # 免得首元素时 [ ] 假值被 -e 误杀）。
          {
            printf '{'
            first=1
            for pair in "darwin-aarch64:TinySSH_${VER}_macos_arm64.app.tar.gz" \
                        "darwin-x86_64:TinySSH_${VER}_macos_x86_64.app.tar.gz"; do
              plat="${pair%%:*}"; file="${pair#*:}"
              sig=$(cat "dist/${file}.sig")
              if [ "$first" -eq 0 ]; then printf ','; fi
              printf '"%s": { "signature": "%s", "url": "https://github.com/%s/releases/download/%s/%s" }' \
                "$plat" "$sig" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$file"
              first=0
            done
            printf '}'
          } > dist/updater-frag-darwin.json
          node -e "JSON.parse(require('fs').readFileSync('dist/updater-frag-darwin.json','utf8')); console.log('darwin 清单片段合法')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "dist-*", merge-multiple: true, path: rel }
      - name: 合并更新清单（updater-frag-* → latest.json；无片段如实跳过）
        run: |
          cd rel
          VER="${GITHUB_REF_NAME#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export VER PUB_DATE
          frags=$(ls updater-frag-*.json 2>/dev/null || true)
          if [ -z "$frags" ]; then
            echo "无 updater 清单片段（未配签名 secrets）——本次发布无 latest.json"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const platforms = {};
            for (const f of process.argv.slice(1)) {
              Object.assign(platforms, JSON.parse(fs.readFileSync(f, "utf8")));
            }
            fs.writeFileSync("latest.json", JSON.stringify(
              { version: process.env.VER, pub_date: process.env.PUB_DATE, platforms }, null, 2));
          ' $frags
          node -e "const m=JSON.parse(require('fs').readFileSync('latest.json','utf8')); if(!m.version||!Object.keys(m.platforms).length){process.exit(1)}; console.log('latest.json 合法（'+Object.keys(m.platforms).length+' 平台）')"
          # 片段只服务合并，不进 Release 也不进 SHA256SUMS（sha256sum * 会收
          # 目录内一切文件，残留在场会让用户 sha256sum -c 报孤儿条目）。
          rm -f updater-frag-*.json
      - name: 校验和与发布说明
        run: |
          cd rel
          # VER 补齐（曾随 v0.10.6 发出空 VER 的下载表——VER 原先只在 build 作业生效）
          VER="${GITHUB_REF_NAME#v}"
          export VER
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat > notes.md <<EOF
          ## 下载 / Downloads

          | 平台 | 产物 |
          |---|---|
          | Windows 10/11 x64 | \`TinySSH_${VER}_windows_x64_portable.exe\`（单文件便携版）+ \`tinyssh-cli_*.exe\` |
          | macOS 11+ (Apple Silicon) | \`TinySSH_${VER}_macos_arm64.app.zip\` / \`.dmg\` |
          | macOS 10.15+ (Intel) | \`TinySSH_${VER}_macos_x86_64.app.zip\` / \`.dmg\` |
          | Linux amd64 | \`TinySSH_${VER}_linux_amd64.deb\`（推荐，自动拉依赖）或 \`.tar.gz\`（需自备 libwebkit2gtk-4.1-0） |

          ## 安装提示 / Install notes

          - Windows：SmartScreen 提示时点「更多信息 → 仍要运行」（未签名分发）。
          - macOS：未签名/未公证。下载后先用 Finder 把 App 拖入「应用程序」（避免系统隔离转存导致钥匙串反复弹窗），首开右键 →「打开」；仍被拦则终端执行 \`xattr -cr /Applications/TinySSH.app\`。系统弹出钥匙串访问时点「允许」（凭据加密主密钥存于钥匙串）。
          - Linux：deb 自动拉取 WebKitGTK 依赖；tar.gz 路线先 \`sudo apt install libwebkit2gtk-4.1-0 libgtk-3-0\`。
          - \`tinyssh\` CLI：随附的命令行伴侣（主机 / Agent Token / 审批 / 接管 / 简报 / 审计），与人机协同主程序同走一套核心。

          构建于 commit ${GITHUB_SHA}。运行期依赖：Windows 自带 WebView2；Linux WebKitGTK 4.1；macOS 系统 WKWebView。
          EOF
          # updater 轮：latest.json 在场（配了签名 secrets）→ 自动更新说明；否则如实说明
          if [ -f latest.json ]; then
            echo "- 自动更新：macOS（.app/.dmg 安装形态）与 Windows 便携版在应用内 设置 → 关于 →「自动更新（下载并重启）」一键升级；Linux 请从本页下载新产物替换。" >> notes.md
          else
            echo "- 自动更新：本次发布未配置更新签名（TAURI_SIGNING_* / TAURI_UPDATER_PUBKEY secrets 未设置），应用内不出现「自动更新」入口——请从本页手动下载更新。" >> notes.md
          fi
      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd rel
          ls -l
          set -o pipefail
          # create 容错（tag 重打后旧 run 可能已建同 tag release）：已存在则 edit，
          # 产物一律 --clobber 上传，收敛到最新一次构建。gh 失败再走 curl 直连
          # REST 兜底（node 造 JSON 保证 notes 转义正确）。
          { gh release create "$GITHUB_REF_NAME" \
              --title "TinySSH ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md \
              --latest \
              TinySSH_* tinyssh-cli_* SHA256SUMS.txt $( [ -f latest.json ] && echo latest.json ) \
            || gh release edit "$GITHUB_REF_NAME" \
              --title "TinySSH ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md --latest \
            || { node -e "
                  const fs=require('fs');
                  fs.writeFileSync('body.json', JSON.stringify({
                    tag_name: process.env.GITHUB_REF_NAME,
                    name: 'TinySSH ' + process.env.GITHUB_REF_NAME.slice(1),
                    body: fs.readFileSync('notes.md','utf8'),
                    make_latest: 'true',
                  }));
                " \
              && curl -sf -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
                --data-binary @body.json; } \
          } 2>&1 | tee rel.log
          gh release upload "$GITHUB_REF_NAME" --clobber \
            TinySSH_* tinyssh-cli_* SHA256SUMS.txt $( [ -f latest.json ] && echo latest.json ) 2>&1 | tee -a rel.log \
          || { # curl 兜底上传：取 release id，逐个 POST 到 uploads.github.com
            rid=$(curl -sf "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$GITHUB_REF_NAME" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).id)})")
            for f in TinySSH_* tinyssh-cli_* SHA256SUMS.txt $( [ -f latest.json ] && echo latest.json ); do
              curl -sf -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$rid/assets?name=$f"
            done
          }
      - name: Release 失败转储（注解匿名可读）
        if: failure()
        run: |
          [ -f rel/rel.log ] || exit 0
          tail -24 rel/rel.log > err.txt
          split -l 4 err.txt chunk_ || true
          for c in chunk_*; do
            msg=$(cat "$c" | tr '\n' ' ' | cut -c1-240)
            echo "::error::GH-REL $msg"
          done
