# 品牌主页发布：website/ 原样发布到 GitHub Pages，无构建步骤
# 纯 SSH 版是主页（index.html），人机协同版在 /agent.html
# 前置：仓库 Settings → Pages → Source 选 GitHub Actions（已由维护者开启）
name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# 同一时刻只允许一次发布，进行中的发布不取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 上传与部署必须分两个 job：deploy-pages 走 Actions API 按 run 取产物，同一个 job 里
  # 上传完不到半秒就去查，产物还没进索引就报「No artifacts named "github-pages"」
  # （2026-11-24、2026-11-28 两次 push 触发都栽在这里，KI-150）；隔一个 job 边界才查得到
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
