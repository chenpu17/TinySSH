# CI 三档（CI 三档轮）：scripts/ci/run.sh 的 GitHub Actions 搬运——档位定义
# 以脚本为准，本文件只是 provider 映射。**如实登记**：仓库现托管 gitee，
# Actions 仅在镜像到 GitHub 时生效，本文件未经真实 runner 实证（本机以
# scripts/ci/run.sh 为准）；Gitee Go 如启用，按同档位翻译。
name: ci
on:
  push:
    branches: [main, ux/modernization]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "档位 1|2|3"
        default: "2"

jobs:
  tier1:
    # 快门：fmt + clippy(报告) + 单元测试 + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --quiet
      - run: cargo test --workspace --lib --bins
      - run: npx tsc --noEmit
        working-directory: ui

  tier2:
    # 集成门：cargo 全量 + UI specs 全量（playwright chromium 供浏览器域）
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: tier1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      - run: cargo test --workspace
      # playwright-core 不带 install CLI，临时拉完整版 playwright 装 chromium，
      # TINYSSH_UI_CHROME 指向其可执行（脚本约定：环境变量指浏览器）
      - run: npx -y playwright install chromium
      - run: |
          npm run dev -- --port 5183 &
          sleep 6
          CHROME=$(ls "$HOME/.cache/ms-playwright"/chromium-*/chrome-linux/chrome | head -1)
          TINYSSH_UI_CHROME="$CHROME" npm test
        working-directory: ui

  tier3:
    # e2e 门：docker sshd 容器 + TINYSSH_E2E_SSHD=1 全量
    if: github.event.workflow_dispatch.inputs.tier == '3'
    needs: tier2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/dev-sshd.sh
      - run: TINYSSH_E2E_SSHD=1 cargo test --workspace
