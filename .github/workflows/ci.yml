# CI（开源轮重写，GitHub Actions 为准；档位定义见 scripts/ci/run.sh，本地同款门禁）：
# - tier1（每次 push/PR，ubuntu）：fmt + clippy + 除桌面壳外全 crate 测试 + ui 前端构建。
# - windows（每次 push/PR）：全 workspace cargo test + ui build——Windows 是产品第一平台，
#   与本机验证矩阵同构（tauri 桌面壳在 ubuntu 需 webkit2gtk 系统库，linux 侧按 crate 排除）。
# - tier2（PR/手动，ubuntu）：UI specs 全量（playwright chromium 供浏览器域，demo 模式跨平台）
#   + android 缩水档（aarch64 debug APK + 16 KB 页对齐门，首跑约 20-40min；只编不签名）。
# - tier3（手动，ubuntu）：docker sshd 容器 + e2e 全量。
# 16 KB 门禁脚本 scripts/ci/check-android-16kb.sh 同时是本地入口（见 scripts/ci/README.md）。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "档位 2|3"
        default: "2"

jobs:
  tier1:
    name: ubuntu · fmt + clippy + core tests + ui build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cargo fmt --all --check
      # 元数据/依赖拉取探针：把解析阶段失败与编译失败分开定位
      - run: |
          set -o pipefail
          if ! cargo metadata --format-version 1 >meta.json 2>meta.err; then
            n=0
            while IFS= read -r l; do
              if [ -n "$l" ]; then echo "::error::META $l"; n=$((n+1)); fi
              [ $n -ge 10 ] && break
            done < meta.err
            exit 1
          fi
      - run: |
          set -o pipefail
          cargo clippy --workspace --exclude tinyssh-app --quiet 2>&1 | tee clippy.log
      - name: 失败时错误尾部进 step summary + 注解（注解经公开 API 匿名可读）
        if: failure()
        run: |
          printf '### clippy tail\n```\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 clippy.log >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          # 注解每步限 10 条：error 行（带上下文）优先——head 全文会被排在前面
          # 的 warning 淹没，真 error 挤不进前 40 行（CI 实测翻车）。
          grep -n -B2 -A8 '^error' clippy.log > err.txt || true
          [ -s err.txt ] || head -80 clippy.log > err.txt || true
          if [ -s err.txt ]; then
            split -l 4 err.txt chunk_
            for c in chunk_*; do
              msg=$(cat "$c" | tr '\n' ' ' | cut -c1-240)
              echo "::error::CLIPPY $msg"
            done
          fi
      # 超时上限：linux 侧疑似存在挂死测试（实测本步骤 90min+ 不完成；windows 同
      # 构步骤 ~25min）。ubuntu 侧用单线程跑：挂死时「最后一个 ok 的下一个测试」
      # 即挂点，转储逐字可读（并行调度下挂点无法从日志尾推定）。windows 维持并行。
      - run: |
          set -o pipefail
          cargo test --workspace --lib --bins --exclude tinyssh-app -- --test-threads=1 2>&1 | tee core-test.log
        timeout-minutes: 45
      # 命令面/版本号哨兵是 filesystem 集成测试，不在 --lib --bins 里；单独快跑。
      - run: cargo test -p session-api --tests -- --test-threads=1
      - run: cargo test -p session-api --features ts --test wire_codegen -- --test-threads=1
      - name: 失败时把测试失败尾部写进 step summary + 注解
        if: failure() || cancelled()
        run: |
          [ -f core-test.log ] || exit 0
          printf '### core tests tail\n```\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 core-test.log >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          # 注解（每步上限 10 条=40 行）先给日志尾 40 行——单线程下最后一个
          # ok 的下一个测试即挂点；进程表垫后留作旁证。
          { tail -40 core-test.log; echo ---PS---; ps aux --sort=-%cpu | head -12; } > ct.txt || true
          if [ -s ct.txt ]; then
            split -l 4 ct.txt ctc_
            for c in ctc_*; do
              msg=$(cat "$c" | tr '\n' ' ' | cut -c1-240)
              echo "::error::CORE-TEST $msg"
            done
          fi
      - run: npm ci
        working-directory: ui
      # tsc 版本随 lock 钉死（此前裸 npx tsc 拉当日最新版，版本漂移不可复现）
      - run: npm run build
        working-directory: ui

  windows:
    name: windows · full workspace tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      # 先出 ui/dist 再编 tauri 壳（tauri-build 校验 frontendDist 存在）
      - run: npm run build
        working-directory: ui
      - run: |
          cargo test --workspace -j 4 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: 失败时测试失败尾部进 step summary + 注解（注解经公开 API 匿名可读）
        if: failure()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### cargo test tail'
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content test.log -Tail 250 | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          $lines = Get-Content test.log
          $hit = $lines | Select-String -Pattern 'failures:|panicked at|test result: FAILED|error\['
          $tail = @($hit | Select-Object -First 20 | ForEach-Object { $_.Line })
          if (-not $tail -or $tail.Count -eq 0) { $tail = @($lines | Select-Object -Last 20) }
          $chunk = ''; $n = 0
          foreach ($l in $tail) {
            if (($chunk + ' ' + $l).Length -gt 230) {
              Write-Host "::error::TESTS $chunk"
              $chunk = ''; $n++; if ($n -ge 10) { break }
            }
            $chunk = ($chunk + ' ' + $l).Trim()
          }
          if ($chunk -and $n -lt 10) { Write-Host "::error::TESTS $chunk" }

  tier2:
    name: ubuntu · UI specs（PR / 手动）
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      - run: cargo test --workspace --exclude tinyssh-app
      # playwright-core 不带 install CLI，临时拉完整版 playwright 装 chromium。
      # 版本必须与 ui 里 vendored 的 playwright-core 对齐（driver 与浏览器同发布
      # 分支），不钉会随 npx 拿到最新 Chrome：浏览器行为漂移会让断言假红（2026-11-24
      # Chrome 159 把 flex 容器的 justify-content: flex-end 序列化成 flow-end）。
      # 浏览器可执行路径由 test/browser.cjs 从 ms-playwright 缓存自动发现。
      - run: npx -y "playwright@$(node -p 'require("playwright-core/package.json").version')" install chromium
        working-directory: ui
      - run: |
          npm run dev -- --port 5183 &
          sleep 6
          npm test
        working-directory: ui

  # Android 缩水档（tier2 档位）：只编 aarch64 debug APK + 16 KB 页对齐门。
  # 不签名、不产 AAB、不上 Play；push 不跑（冷构建 35-50min，push 档已有 windows 全量）。
  android:
    name: android · aarch64 debug APK + 16KB 对齐门
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      # 只需 arm64 目标；x86_64 留给本地模拟器构建
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        # 注意：Android debug .so 很大（本机 96 MiB/单 ABI），target 缓存可能
        # 逼近 10 GB 仓库上限；如超限再收窄为只缓存 ~/.cargo/registry。
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      # runner 镜像自带 ANDROID_HOME + 若干 NDK；只补缺失组件。
      # 关键：cargo-mobile2 的 ensure_ndk 会无视 NDK_HOME、取 ndk/ 下版本号最大的
      # 那个，所以不要依赖「钉死某个 NDK 版本」——让 16KB 门做唯一判据。
      - name: Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-36" "build-tools;36.1.0" > /dev/null
          if [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
            "$SM" --install "ndk;27.0.12077973" > /dev/null
          fi
          echo "NDKs:"; ls "$SDK/ndk"
          # 给 16KB 门兜底一个 llvm-readelf（binutils 的 readelf 通常已在 PATH）
          NDK=$(ls -d "$SDK"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # 只做 ~/.gradle 缓存；wrapper 发行版仍从 gradle-wrapper.properties 的
      # 腾讯镜像下载（见 scripts/ci/README.md 的遗留风险登记）。
      - uses: gradle/actions/setup-gradle@v4

      # 关键：gen/android/buildSrc/.../BuildTask.kt 里 gradle 回调的是
      # `cargo tauri android android-studio-script`，必须有 cargo-tauri 可执行文件；
      # npm 的 @tauri-apps/cli 只提供 `tauri`（`npm view ... bin` 只有 tauri），
      # taiki-e/install-action 也不收录 tauri-cli。故用 cargo install + 二进制缓存。
      - uses: actions/cache@v4
        id: cargo-tauri
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-2.10.1-${{ runner.os }}
      - if: steps.cargo-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.10.1 --locked

      - run: npm ci
        working-directory: ui

      # --ci 在 Actions 里本就由 CI env 触发（clap env = "CI"），显式写出便于本地复跑。
      # -f mobile 必须显式：tauri.android.conf.json 的 build.features 不被采纳
      # （docs/architecture/l1-component-design.md 移动端装配一节）。
      - name: 构建 debug APK（aarch64）
        run: cargo tauri android build --target aarch64 --apk --debug --ci -f mobile

      - name: 16 KB 页对齐门（ELF PT_LOAD + APK zip 偏移）
        run: |
          bash scripts/ci/check-android-16kb.sh \
            target/aarch64-linux-android/debug/libtinyssh_app_lib.so \
            $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | sort)

      # error 级 lint 即红（MissingTranslation/TV 声明这类此前全静默）；复用上一步
      # 的 gradle 缓存与已编译产物，额外开销主要是 lint 分析本身。RustPlugin 按架构
      # 建了 flavor，单 APK 构建走 universal，故任务名带 flavor 前缀。
      - name: Android lint
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:lintUniversalDebug --console=plain

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-lint-report
          path: src-tauri/gen/android/app/build/reports/lint-results-universalDebug.*
          retention-days: 7

      # 版本号断言（防 tauri.properties 兜底值 1/1.0 混入产物）
      - name: 产物版本号与 tauri.conf 一致
        run: |
          VER=$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json | head -1)
          BT=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -1)
          "$BT/aapt2" dump badging \
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            | grep -q "versionName='${VER}'" || { echo "::error::APK versionName != ${VER}"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 7

  tier3:
    name: ubuntu · e2e（docker sshd，手动档 3）
    # 手动输入只在 inputs / github.event.inputs 两个上下文里；事件载荷没有
    # workflow_dispatch 这一层，原写法 github.event.workflow_dispatch.inputs.tier 恒为 null，
    # tier=3 也永远 skipped（KI-140）。
    if: github.event.inputs.tier == '3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/dev-sshd.sh
        # --no-fail-fast：cargo 默认在第一个失败的测试二进制处收工，后面的 e2e 二进制
        # 一个都不跑——手动档一次要几十分钟，首跑只看到 core_jump 红、其余全是盲区
        # （KI-142）。跑完所有二进制再汇总，一次派发拿到完整的红名单。
      - run: TINYSSH_E2E_SSHD=1 cargo test --workspace --exclude tinyssh-app --no-fail-fast
