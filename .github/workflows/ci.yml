# CI（开源轮重写，GitHub Actions 为准；档位定义见 scripts/ci/run.sh，本地同款门禁）：
# - tier1（每次 push/PR，ubuntu）：fmt + clippy + 除桌面壳外全 crate 测试 + ui 前端构建。
# - windows（每次 push/PR）：全 workspace cargo test + ui build——Windows 是产品第一平台，
#   与本机验证矩阵同构（tauri 桌面壳在 ubuntu 需 webkit2gtk 系统库，linux 侧按 crate 排除）。
# - tier2（PR/手动，ubuntu）：UI specs 全量（playwright chromium 供浏览器域，demo 模式跨平台）。
# - tier3（手动，ubuntu）：docker sshd 容器 + e2e 全量。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "档位 2|3"
        default: "2"

jobs:
  tier1:
    name: ubuntu · fmt + clippy + core tests + ui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: cargo fmt --all --check
      - run: |
          set -o pipefail
          cargo clippy --workspace --exclude tinyssh-app --quiet 2>&1 | tee clippy.log
      - name: 失败时把错误尾部写进 step summary（匿名可读，无需登录看日志）
        if: failure()
        run: |
          printf '### clippy tail\n```\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 clippy.log >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - run: |
          set -o pipefail
          cargo test --workspace --lib --bins --exclude tinyssh-app 2>&1 | tee core-test.log
      - name: 失败时把测试失败尾部写进 step summary
        if: failure()
        run: |
          printf '### core tests tail\n```\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 core-test.log >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
        working-directory: ui
      # tsc 版本随 lock 钉死（此前裸 npx tsc 拉当日最新版，版本漂移不可复现）
      - run: npm run build
        working-directory: ui

  windows:
    name: windows · full workspace tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      # 先出 ui/dist 再编 tauri 壳（tauri-build 校验 frontendDist 存在）
      - run: npm run build
        working-directory: ui
      - run: |
          cargo test --workspace -j 4 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: 失败时把测试失败尾部写进 step summary（匿名可读，无需登录看日志）
        if: failure()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '### cargo test tail'
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content test.log -Tail 250 | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'

  tier2:
    name: ubuntu · UI specs（PR / 手动）
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
        working-directory: ui
      - run: cargo test --workspace --exclude tinyssh-app
      # playwright-core 不带 install CLI，临时拉完整版 playwright 装 chromium，
      # TINYSSH_UI_CHROME 指向其可执行（脚本约定：环境变量指浏览器）
      - run: npx -y playwright install chromium
      - run: |
          npm run dev -- --port 5183 &
          sleep 6
          CHROME=$(ls "$HOME/.cache/ms-playwright"/chromium-*/chrome-linux/chrome | head -1)
          TINYSSH_UI_CHROME="$CHROME" npm test
        working-directory: ui

  tier3:
    name: ubuntu · e2e（docker sshd，手动档 3）
    if: github.event.workflow_dispatch.inputs.tier == '3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/dev-sshd.sh
      - run: TINYSSH_E2E_SSHD=1 cargo test --workspace --exclude tinyssh-app
