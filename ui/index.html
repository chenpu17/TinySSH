<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：Android 边到边（edge-to-edge）下软键盘
         默认覆盖视口，状态栏/终端底部被键盘压住且 xterm 不缩排。声明让键盘顶起
         布局视口后，100dvh 与 ResizeObserver 恢复正常收缩（Chrome/WebView 108+）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141d33'/%3E%3Cpath d='M8.2 10.1l6.2 5.9-6.2 5.9' stroke='%23f0f3fa' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='18.5' y='16.9' width='6.6' height='5' rx='1.4' fill='%238b6cff'/%3E%3C/svg%3E" />
    <title>TinySSH — 人机协同 SSH</title>
    <!-- 首帧主题：外观/色板存在 localStorage 时必须在 CSS 生效前挂上 dataset，
         否则浅色用户每次启动都先闪一屏深色（设置从 vault 异步读回才纠正）。
         CSP 禁内联脚本，故独立小文件同步加载。 -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
