<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：Android 边到边（edge-to-edge）下软键盘
         默认覆盖视口，状态栏/终端底部被键盘压住且 xterm 不缩排。声明让键盘顶起
         布局视口后，100dvh 与 ResizeObserver 恢复正常收缩（Chrome/WebView 108+）。 -->
    <!-- viewport-fit=cover：Android 15 边到边放行后 env(safe-area-inset-*) 才有值，
         安全区由 styles.css 按 :root[data-platform] 消费（桌面无平台标记不受影响）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%231a223e'/%3E%3Cstop offset='1' stop-color='%23090c16'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='96' y='96' width='832' height='832' rx='224' fill='url(%23b)'/%3E%3Cpath d='M255 318 L467 512 L255 706' fill='none' stroke='%23f0f3fa' stroke-width='84' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='584' y='532' width='228' height='176' rx='52' fill='%238b6cff'/%3E%3C/svg%3E" />
    <title>TinySSH — 人机协同 SSH</title>
    <!-- 首帧主题：外观/色板存在 localStorage 时必须在 CSS 生效前挂上 dataset，
         否则浅色用户每次启动都先闪一屏深色（设置从 vault 异步读回才纠正）。
         CSP 禁内联脚本，故独立小文件同步加载。 -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
