# Windows MSVC 目标静态链接 CRT（单一二进制发布的前提）。
# 约束：便携单 exe 分发不能假设目标机装有 VC++ Redist——动态 CRT
# （vcruntime140/msvcp140）缺失时启动即弹缺 DLL 对话框。静态后
# 调试/发布同链路，避免用 RUSTFLAGS 环境变量切换造成缓存全量重编震荡。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Android 16 KB 页对齐（Android 15+ 部分设备、Play 对 targetSdk 35+ 的要求）：
# NDK r27 的链接器默认仍按 4 KB 出 LOAD 段，装到 16 KB 页设备上 dlopen 失败
# （应用启动即崩）。链接期显式抬到 16 KB；arm64 与 x86_64（模拟器/平板）都要。
# 验收：llvm-readelf -l 看 LOAD 的 Align 应为 0x4000。
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# git 依赖统一走 git CLI 拉取：尊重用户 git 配置（insteadOf 覆写、代理），
# 弱网下也比 libgit2 内建传输稳。TinyAgent 内核即经此通路解析。
[net]
git-fetch-with-cli = true
