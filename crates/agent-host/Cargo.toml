[package]
name = "tinyssh-agent-host"
version = "0.1.0"
edition = "2021"
description = "TinySSH 内置 Agent 宿主：tiny-agent-core 驱动的会话内对话 agent，工具桥接 SSH 会话"

[dependencies]
tiny_agent = { package = "tiny-agent-core", path = "../../../git/tiny-a/crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# mock provider 仅测试构建统一进来（cargo feature 统一规则：dev-dependencies 的
# feature 在测试构建生效，release 构建不受影响）——离线跑通「对话→工具→审批」全链。
tiny_agent = { package = "tiny-agent-core", path = "../../../git/tiny-a/crates/core", features = ["mock"] }
