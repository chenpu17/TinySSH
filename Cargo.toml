[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/session-api",
    "crates/core-session",
    "crates/transport-ssh",
    "crates/transport-pty",
    "crates/term-core",
    "crates/approval",
    "crates/audit",
    "crates/vault",
    "crates/records",
    "crates/mcp-server",
    "crates/shim",
    "crates/cli",
    "crates/testbed",
    "crates/agent-host",
]
default-members = [
    "src-tauri",
    "crates/session-api",
    "crates/core-session",
    "crates/transport-ssh",
    "crates/transport-pty",
    "crates/term-core",
    "crates/approval",
    "crates/audit",
    "crates/vault",
    "crates/records",
    "crates/mcp-server",
    "crates/shim",
    "crates/cli",
    "crates/testbed",
    "crates/agent-host",
]
# src-tauri 作为独立 member 加入（见 src-tauri/Cargo.toml），此处不列出以避免
# 未安装前端依赖时阻塞 workspace 命令；src-tauri/Cargo.toml 自身声明 workspace = true。

[workspace.package]
version = "0.10.2"
edition = "2021"
license = "Apache-2.0"
authors = ["TinySSH contributors"]

[workspace.dependencies]
# 内部 crates
session-api = { path = "crates/session-api" }
core-session = { path = "crates/core-session" }
transport-ssh = { path = "crates/transport-ssh" }
transport-pty = { path = "crates/transport-pty" }
term-core = { path = "crates/term-core" }
tinyssh-approval = { path = "crates/approval" }
tinyssh-audit = { path = "crates/audit" }
tinyssh-vault = { path = "crates/vault" }
tinyssh-records = { path = "crates/records" }
tinyssh-mcp-server = { path = "crates/mcp-server" }
tinyssh-shim = { path = "crates/shim" }
tinyssh-testbed = { path = "crates/testbed" }
tinyssh-agent-host = { path = "crates/agent-host" }

# 异步与基础
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误与日志
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 传输层（版本门限：russh >= 0.61，见 L0 §4）
russh = "0.63"
russh-sftp = "3"
portable-pty = "0.9"

# 终端语义层
alacritty_terminal = "0.26"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
regex = "1"
encoding_rs = "0.8"

# 存储
rusqlite = { version = "0.40", features = ["bundled"] }

# 加密与凭据
keyring = "4"
chacha20poly1305 = "0.11"
argon2 = "0.6"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# HTTP / MCP（版本门限：rmcp >= 2.0.0，见 L0 §4）
rmcp = { version = "3", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
axum = "0.8"
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http = "1"

# 通用工具
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
libc = "0.2"

# 测试
tempfile = "3"

[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false
